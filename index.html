<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gokah AI - Ghana Voice Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-gradient"></div>

<div class="glass-container">
  <header>
    <h1>🎙️ Gokah</h1>
    <p>Talk to AI in your Ghanaian Language</p>
  </header>

  <div class="controls">
    <label>Speak in:</label>
    <select id="language" class="glass-select">
      <option value="en">English</option>
      <option value="ak">Twi - Akan</option>
      <option value="ga">Ga</option>
      <option value="ee">Ewe</option>
      <option value="ha">Hausa</option>
    </select>
  </div>

  <div class="mic-section">
    <button id="micBtn" class="glass-mic">
      <div class="mic-ring"></div>
      <span class="mic-icon">🎤</span>
    </button>
    <p id="status">Tap and Speak</p>
  </div>

  <div id="chatBox" class="glass-chat">
    <div class="chat-header">Conversation</div>
    <div id="chatLog"></div>
  </div>
</div>

<audio id="audioPlayer" hidden></audio>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
